<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="spectreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Disc Background -->
  <rect width="64" height="64" rx="16" fill="#020204" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#spectreGradient)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Hypercar Aerodynamic Emblem / Lightning 'S' -->
  <g filter="url(#neonGlow)">
    <!-- Aerodynamic Spectre Emblem -->
    <path 
      d="M38 12 L16 34 H30 L22 52 L48 28 H34 L42 12 Z" 
      fill="url(#spectreGradient)" 
    />
  </g>
</svg>
