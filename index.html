<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <title>SPECTRE | Ultra-Luxury E-Hypercar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Guard against environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchFn = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return fetchFn || originalFetch; },
              set: function(val) { fetchFn = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            try {
              Object.defineProperty(Object.getPrototypeOf(window), 'fetch', {
                get: function() { return fetchFn || originalFetch; },
                set: function(val) { fetchFn = val; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }
        } catch (_) {}
      })();
    </script>
